name: hub-ci

on:
  pull_request:
  push:
    branches: [main, "feat/**", "fix/**", harness-integration]

# A newer push supersedes any older run for the same branch. In particular,
# an older main build must not finish later and move `latest` backwards.
concurrency:
  group: hub-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The fast deterministic suite: levels/config parsing, validator, prompts,
  # temporal, KB, roles, and the /v1 OpenAI-compat contract (test_bridge) that
  # both the validation harness and the OpenMRS chat consume. No network, no
  # models — anything LLM-dependent is exercised by the harness's validate
  # runs, not here.
  unit-and-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # Same Poetry version the Dockerfile pins, so the lockfile parses identically.
      - name: Install Poetry
        run: pip install "poetry==1.8.3"

      - name: Install dependencies (locked)
        run: poetry install --with dev --no-interaction

      - name: Run tests
        run: poetry run pytest -q tests/

  # The hub ships exclusively as a container (compose service med-agent-hub);
  # a broken Dockerfile is invisible to pytest but breaks the whole stack.
  docker-build:
    strategy:
      fail-fast: true
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      # HUB_BUILD_REVISION must be the real commit: validate_config() rejects
      # the Dockerfile's "unknown" default, so an image built without it builds
      # fine and then refuses to start.
      - name: Build image
        run: |
          docker build --build-arg HUB_BUILD_REVISION="${GITHUB_SHA}" -t hub-ci-candidate .

      # Building is not evidence the image runs: validate_config() executes at
      # import, so a container that starts and answers /health is what proves
      # the packaged configuration is actually serviceable.
      - name: Verify the image starts and serves /health
        run: |
          docker run -d --name hub-smoke -p 8080:8080 hub-ci-candidate
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8080/health >/dev/null 2>&1; then
              echo "healthy after ${i}s"
              docker rm -f hub-smoke >/dev/null
              exit 0
            fi
            sleep 1
          done
          echo "image never served /health:" >&2
          docker logs hub-smoke >&2
          docker rm -f hub-smoke >/dev/null
          exit 1

      # Preserve the tested bytes for the separately permissioned publish job.
      # Pull requests prove the build and startup path but do not upload or push.
      - name: Export the tested image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: docker save --output /tmp/hub-ci-candidate-${{ matrix.arch }}.tar hub-ci-candidate

      - name: Transfer the tested image to the publish job
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: hub-ci-candidate-${{ matrix.arch }}-${{ github.sha }}
          path: /tmp/hub-ci-candidate-${{ matrix.arch }}.tar
          retention-days: 1
          if-no-files-found: error

  # Only reviewed main commits may publish. This job receives the exact images
  # that passed /health on each architecture; it never rebuilds the source tree.
  publish:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [unit-and-contract, docker-build]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      published-image: ${{ steps.publish.outputs.image }}
    steps:
      - name: Download the tested amd64 image
        uses: actions/download-artifact@v4
        with:
          name: hub-ci-candidate-amd64-${{ github.sha }}
          path: /tmp

      - name: Download the tested arm64 image
        uses: actions/download-artifact@v4
        with:
          name: hub-ci-candidate-arm64-${{ github.sha }}
          path: /tmp

      - name: Load and verify the tested images
        env:
          IMAGE_NAME: ghcr.io/${{ github.repository }}
        run: |
          for arch in amd64 arm64; do
            docker load --input "/tmp/hub-ci-candidate-${arch}.tar"
            revision="$(docker image inspect --format \
              '{{index .Config.Labels "org.opencontainers.image.revision"}}' \
              hub-ci-candidate)"
            test "${revision}" = "${GITHUB_SHA}"
            docker tag hub-ci-candidate "${IMAGE_NAME}:${GITHUB_SHA}-${arch}"
            docker rmi hub-ci-candidate
          done

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Publish the exact tested images and assemble a multi-arch manifest index.
      - name: Publish the tested multi-arch image and record its immutable digest
        id: publish
        env:
          IMAGE_NAME: ghcr.io/${{ github.repository }}
        run: |
          docker push "${IMAGE_NAME}:${GITHUB_SHA}-amd64"
          docker push "${IMAGE_NAME}:${GITHUB_SHA}-arm64"
          docker buildx imagetools create \
            -t "${IMAGE_NAME}:${GITHUB_SHA}" \
            -t "${IMAGE_NAME}:latest" \
            "${IMAGE_NAME}:${GITHUB_SHA}-amd64" \
            "${IMAGE_NAME}:${GITHUB_SHA}-arm64"

          digest="$(docker buildx imagetools inspect \
            "${IMAGE_NAME}:${GITHUB_SHA}" --format '{{.Manifest.Digest}}')"
          case "${digest}" in
            sha256:????????????????????????????????????????????????????????????????) ;;
            *) echo "Could not resolve the published manifest digest: ${digest}" >&2; exit 1 ;;
          esac

          immutable_image="${IMAGE_NAME}@${digest}"
          echo "image=${immutable_image}" >> "${GITHUB_OUTPUT}"
          echo "### Published tested multi-arch Hub image" >> "${GITHUB_STEP_SUMMARY}"
          echo "\`${immutable_image}\`" >> "${GITHUB_STEP_SUMMARY}"
