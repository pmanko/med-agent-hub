# Declarative execution profiles for med-agent-hub.
#
# This catalog contains current product profiles, matched evaluation controls,
# and one quarantined high-team debug profile. Historical experiment ids remain
# available from their pinned Git revisions and run manifests. Dynamic answer:,
# answer-review:, and indepth-only: legs are parsed by levels_loader.py.

stage_sets:
  single_answer: &single_answer [context, answer, gate]
  product: &product [context, answer, gate, resolve_refs, review, gate, final_resolve_refs, ground_verdicts, indepth, indepth_gate]
  product_fast: &product_fast [context, answer, gate, resolve_refs, review, gate, final_resolve_refs, ground_verdicts]
  product_answer: &product_answer [context, answer, gate, resolve_refs, final_resolve_refs, ground_verdicts]
  product_bare: &product_bare [context, answer, gate, resolve_refs, final_resolve_refs, indepth, indepth_gate]
  product_agree: &product_agree [context, answer, gate, resolve_refs, final_resolve_refs, agree, indepth, indepth_gate]
  team_product: &team_product [context, gather, answer, gate, resolve_refs, review, gate, final_resolve_refs, ground_verdicts, indepth, indepth_gate]

profiles:
  # The shared Profile schema supports caller-orchestrated workflows. Catalyst
  # owns SQL/catalog/lint/execution logic; Hub owns these configured role calls.
  catalyst-query-e4b-qwen14b:
    workflow: catalyst_query
    label: "Catalyst query — Gemma 4 E4B writer, Qwen 2.5 14B reviewer"
    topology: caller
    stages: [context, query_generate, query_lint, query_review, query_finalize]
    models:
      query_generate: gemma-e4b
      query_review: qwen2.5-14b
    prompts:
      query_generate: catalyst-query-generate
      query_review: catalyst-query-review
    knobs:
      query_generate: {temperature: 0, dry: 0, maxTokens: 2048}
      query_review: {temperature: 0, dry: 0, maxTokens: 2048}
    policies:
      orchestration_owner: catalyst
      generation_attempts: 3
      allowed_operation: select
      collaborative_review: true
      model_classes:
        query_generate: gemma-4-e4b
        query_review: qwen2.5-14b
    visibility: product
    selection_priority: 10
    outputContracts: [catalyst.query.v1]

  # Fast writer-only lane. It stays visibly unavailable until the model router
  # advertises gemma-e4b; Catalyst never substitutes another profile.
  catalyst-query-gemma-4-e4b:
    workflow: catalyst_query
    label: "Faster question preparation"
    topology: caller
    stages: [context, query_generate, query_lint, query_finalize]
    models:
      query_generate: gemma-e4b
    prompts:
      query_generate: catalyst-query-generate
    knobs:
      query_generate: {temperature: 0, dry: 0, maxTokens: 2048}
    policies:
      orchestration_owner: catalyst
      generation_attempts: 3
      allowed_operation: select
      collaborative_review: false
      model_classes:
        query_generate: gemma-4-e4b
    visibility: product
    selection_priority: 5
    outputContracts: [catalyst.query.v1]

  catalyst-query-gemma-4-12b:
    workflow: catalyst_query
    label: "Standard question preparation"
    topology: caller
    stages: [context, query_generate, query_lint, query_finalize]
    models:
      query_generate: gemma-4-12b-q4
    prompts:
      query_generate: catalyst-query-generate
    knobs:
      query_generate: {temperature: 0, dry: 0, maxTokens: 2048}
    policies:
      orchestration_owner: catalyst
      generation_attempts: 3
      allowed_operation: select
      collaborative_review: false
      model_classes:
        query_generate: gemma-4-12b
    visibility: product
    selection_priority: 20
    outputContracts: [catalyst.query.v1]

  # Cross-family reviewed lane: the reviewer is a different model family from the
  # writer, so review is genuinely independent rather than a model re-reading its
  # own output. Both stay resident on a 24G-class GPU once warm.
  catalyst-query-gemma-4-12b-qwen2.5-14b-checked:
    workflow: catalyst_query
    label: "Catalyst query — Gemma 4 12B writer, Qwen 2.5 14B reviewer"
    topology: caller
    stages: [context, query_generate, query_lint, query_review, query_finalize]
    models:
      query_generate: gemma-4-12b
      query_review: qwen2.5-14b
    prompts:
      query_generate: catalyst-query-generate
      query_review: catalyst-query-review
    knobs:
      query_generate: {temperature: 0, dry: 0, maxTokens: 2048}
      query_review: {temperature: 0, dry: 0, maxTokens: 2048}
    policies:
      orchestration_owner: catalyst
      generation_attempts: 3
      allowed_operation: select
      collaborative_review: true
      model_classes:
        query_generate: gemma-4
        query_review: qwen2.5
    visibility: product
    selection_priority: 15
    outputContracts: [catalyst.query.v1]

  # Self-checked single-model lane: one Q4 writer fills both roles, so a second
  # pass is available on a CPU-only host without loading a second large model.
  # Not collaborative — same model class reviewing itself.
  catalyst-query-gemma-4-12b-q4-checked:
    workflow: catalyst_query
    label: "Catalyst query — Gemma 4 12B (Q4, self-checked)"
    topology: caller
    stages: [context, query_generate, query_lint, query_review, query_finalize]
    models:
      query_generate: gemma-4-12b-q4
      query_review: gemma-4-12b-q4
    prompts:
      query_generate: catalyst-query-generate
      query_review: catalyst-query-review
    knobs:
      query_generate: {temperature: 0, dry: 0, maxTokens: 2048}
      query_review: {temperature: 0, dry: 0, maxTokens: 2048}
    policies:
      orchestration_owner: catalyst
      generation_attempts: 3
      allowed_operation: select
      collaborative_review: false
      model_classes:
        query_generate: gemma-4-q4
        query_review: gemma-4-q4
    visibility: product
    selection_priority: 30
    outputContracts: [catalyst.query.v1]

  # Smallest writer-only lane: runs on any host. Deterministic lint decides
  # whether the single candidate can be finalized; there is no reviewer role.
  catalyst-query-qwen-coder-1.5b:
    workflow: catalyst_query
    label: "Catalyst query — Qwen 2.5 Coder 1.5B (Q4, writer only)"
    topology: caller
    stages: [context, query_generate, query_lint, query_finalize]
    models:
      query_generate: qwen2.5-coder-1.5b-instruct-q4_k_m
    prompts:
      query_generate: catalyst-query-generate
    knobs:
      query_generate: {temperature: 0, dry: 0, maxTokens: 2048}
    policies:
      orchestration_owner: catalyst
      generation_attempts: 3
      allowed_operation: select
      collaborative_review: false
      model_classes:
        query_generate: qwen2.5-coder
    visibility: product
    selection_priority: 40
    outputContracts: [catalyst.query.v1]

  single-e4b-checked:
    label: Fast checked answer (E4B)
    topology: single
    stages: *product
    models: {answer: gemma-e4b, review: gemma-e4b, grounding: gemma-e4b, indepth: gemma-e4b}
    prompts: {answer: synthesis-answer, review: validation-label, indepth: synthesis-indepth}
    policies: {output: product, temporal_gate: enforce, temporal_render: full, drug_safety: true, review: {action: label, grounding: separate}}
    visibility: product
    selection_priority: 10
    context: {window: 24576, reserved_output_tokens: 4096, exact_tokenizer: true, supplemental_sources: [knowledge-base]}
    knobs: {answer: {temperature: 0}}

  single-e2b-checked:
    label: Experimental fast answer (E2B, E4B check)
    topology: single
    stages: *product
    models: {answer: gemma-e2b, review: gemma-e4b, grounding: gemma-e4b, indepth: gemma-e4b}
    prompts: {answer: synthesis-answer, review: validation-label, indepth: synthesis-indepth}
    policies: {output: product, temporal_gate: enforce, temporal_render: full, drug_safety: true, review: {action: label, grounding: separate}}
    visibility: product
    selection_priority: 15
    context: {window: 24576, reserved_output_tokens: 4096, exact_tokenizer: true, supplemental_sources: [knowledge-base]}
    knobs: {answer: {temperature: 0}}

  single-a4b-checked:
    label: Efficient checked answer (A4B)
    topology: single
    stages: *product
    models: {answer: gemma-26b, review: gemma-26b, grounding: gemma-26b, indepth: gemma-26b}
    prompts: {answer: synthesis-answer, review: validation-label, indepth: synthesis-indepth}
    policies: {output: product, temporal_gate: enforce, temporal_render: full, drug_safety: true, review: {action: label, grounding: separate}}
    visibility: product
    selection_priority: 20
    context: {window: 24576, reserved_output_tokens: 4096, exact_tokenizer: true, supplemental_sources: [knowledge-base]}
    knobs: {answer: {temperature: 0}}

  single-12b-checked:
    label: Checked answer (12B)
    topology: single
    stages: *product
    models: {answer: gemma-4-12b, review: gemma-4-12b, grounding: gemma-4-12b, indepth: gemma-4-12b}
    prompts: {answer: synthesis-answer, review: validation-label, indepth: synthesis-indepth}
    policies: {output: product, temporal_gate: enforce, temporal_render: full, drug_safety: true, review: {action: label, grounding: separate}, confidence: findings}
    visibility: product
    selection_priority: 30
    context: {window: 24576, reserved_output_tokens: 4096, exact_tokenizer: true, supplemental_sources: [knowledge-base]}
    knobs: {answer: {temperature: 0}}

  single-12b-fast:
    label: Fast checked answer (12B, no In-Depth)
    topology: single
    stages: *product_fast
    models: {answer: gemma-4-12b, review: gemma-4-12b, grounding: gemma-4-12b}
    prompts: {answer: synthesis-answer, review: validation-label}
    policies: {output: product, temporal_gate: enforce, temporal_render: full, drug_safety: true, review: {action: label, grounding: separate}}
    visibility: product
    selection_priority: 35
    context: {window: 24576, reserved_output_tokens: 4096, exact_tokenizer: true, supplemental_sources: [knowledge-base]}
    knobs: {answer: {temperature: 0}}

  # One answer call with only the deterministic and grounding checks: the product-path
  # counterpart of ChartSearchAI's bundled provider, for comparing the two on one engine.
  single-12b-answer:
    label: Answer with deterministic checks (12B, no review or In-Depth)
    topology: single
    stages: *product_answer
    models: {answer: gemma-4-12b, grounding: gemma-4-12b}
    prompts: {answer: synthesis-answer}
    policies: {output: product, temporal_gate: enforce, temporal_render: full, drug_safety: true, review: {action: label, grounding: separate}, confidence: findings}
    visibility: product
    selection_priority: 40
    context: {window: 24576, reserved_output_tokens: 4096, exact_tokenizer: true, supplemental_sources: [knowledge-base]}
    knobs: {answer: {temperature: 0}}

  # Checked-answer research arms: single-12b-checked's stages, context and policies with one
  # choice changed each. Offered in the app after the default (single-12b-bare); the harness runs them as arms.

  single-31b-xcheck:
    label: Checked answer (31B writer, Qwen3.5 9B verifier)
    topology: single
    stages: *product
    models: {answer: gemma-31b, review: qwen3.5-9b, grounding: qwen3.5-9b, indepth: gemma-31b}
    prompts: {answer: synthesis-answer, review: validation-verify, indepth: synthesis-indepth}
    policies: {output: product, temporal_gate: enforce, temporal_render: full, drug_safety: true, review: {action: label, grounding: separate}, confidence: findings}
    visibility: product
    selection_priority: 51
    context: {window: 24576, reserved_output_tokens: 4096, exact_tokenizer: true, supplemental_sources: [knowledge-base]}
    knobs: {answer: {temperature: 0}, review: {temperature: 0.7}}

  # Run D (confidence-labels.md, pruning of 28 October): three checked arms that each answer one
  # question. bare: the deterministic checks alone. verify: a cross-family reviewer that asks
  # and answers verification questions. agree: a second writer from another family answers on
  # its own and each sentence of the shown answer is checked against its answer.
  single-12b-bare:
    label: Answer with the chart checks only (12B)
    topology: single
    stages: *product_bare
    models: {answer: gemma-4-12b, indepth: gemma-4-12b}
    prompts: {answer: synthesis-answer, indepth: synthesis-indepth}
    policies: {output: product, temporal_gate: enforce, temporal_render: full, drug_safety: true, confidence: findings}
    visibility: product
    default: true
    selection_priority: 10
    context: {window: 24576, reserved_output_tokens: 4096, exact_tokenizer: true, supplemental_sources: [knowledge-base]}
    knobs: {answer: {temperature: 0}}

  # The verifier performs one review call per section with citation verdicts folded in
  # (falling back to separate citation checks when the review omits citation verdicts);
  # Qwen3.5-9B keeps 10 GB free for the writer's prompt cache (run D on 28 October: the
  # 12B ran twice as slow beside the 35B).
  single-12b-verify:
    label: Checked answer (12B writer, Qwen3.5 9B verifier)
    topology: single
    stages: *product
    models: {answer: gemma-4-12b, review: qwen3.5-9b, grounding: gemma-4-12b, indepth: gemma-4-12b}
    prompts: {answer: synthesis-answer, review: validation-verify, indepth: synthesis-indepth}
    policies: {output: product, temporal_gate: enforce, temporal_render: full, drug_safety: true, review: {action: label, grounding: folded}, confidence: findings}
    visibility: product
    selection_priority: 55
    context: {window: 24576, reserved_output_tokens: 4096, exact_tokenizer: true, supplemental_sources: [knowledge-base]}
    knobs: {answer: {temperature: 0}, review: {temperature: 0}}

  single-12b-agree:
    label: Answer agreed by a second writer (12B and Qwen3.6 35B-A3B)
    topology: single
    stages: *product_agree
    models: {answer: gemma-4-12b, second: qwen3.6-35b, indepth: gemma-4-12b}
    prompts: {answer: synthesis-answer, indepth: synthesis-indepth}
    policies: {output: product, temporal_gate: enforce, temporal_render: full, drug_safety: true, confidence: findings}
    visibility: product
    selection_priority: 56
    context: {window: 24576, reserved_output_tokens: 4096, exact_tokenizer: true, supplemental_sources: [knowledge-base]}
    knobs: {answer: {temperature: 0}}

  team-med-checked:
    label: Checked medical team
    topology: team
    stages: *team_product
    models: {orchestrator: gemma-e4b-q8, expert: medgemma-1.5-4b-q8, answer: qwen2.5-14b, review: gemma-4-12b, grounding: qwen2.5-14b, indepth: qwen2.5-14b}
    prompts: {answer: synthesis-answer, review: validation-label, indepth: synthesis-indepth, orchestrator: orchestrator, expert: medical_expert}
    policies: {output: product, temporal_gate: enforce, temporal_render: full, drug_safety: true, review: {action: label, grounding: separate}}
    visibility: product
    selection_priority: 100
    context: {window: 24576, reserved_output_tokens: 4096, exact_tokenizer: true, supplemental_sources: [knowledge-base]}

  # Quarantined from product discovery and publishable candidate runs. This one
  # explicit profile preserves targeted high-team failure analysis without
  # retaining the historical experiment matrix in the runtime catalog.
  debug-team-high-checked:
    label: Debug high-capacity checked team
    topology: team
    stages: *team_product
    models: {orchestrator: gemma-31b, expert: medgemma-27b, answer: qwen3.6-35b-q6, review: gemma-31b, grounding: qwen3.6-35b-q6, indepth: qwen3.6-35b-q6}
    prompts: {answer: synthesis-answer, review: validation-label, indepth: synthesis-indepth, orchestrator: orchestrator, expert: medical_expert}
    policies: {output: product, temporal_gate: enforce, temporal_render: full, drug_safety: true, review: {action: label, grounding: separate}}
    visibility: debug
    context: {window: 24576, reserved_output_tokens: 4096, exact_tokenizer: true, supplemental_sources: [knowledge-base]}

  # Matched controls for the current small-model Answer-path comparison. These
  # are hidden from product clients and differ only in model or gate policy.
  eval-e4b-answer-only:
    label: E4B answer only
    topology: single
    stages: *single_answer
    models: {answer: gemma-e4b}
    prompts: {answer: synthesis-answer}
    policies: {output: bare, answer_contract: chart_answer, temporal_gate: "off", temporal_render: full}
    visibility: evaluation
    context: {window: 24576, reserved_output_tokens: 4096, exact_tokenizer: true, supplemental_sources: [knowledge-base]}
    knobs: {answer: {temperature: 0}}

  eval-e4b-temporal-enforce:
    label: E4B deterministic temporal check
    topology: single
    stages: *single_answer
    models: {answer: gemma-e4b}
    prompts: {answer: synthesis-answer}
    policies: {output: bare, answer_contract: chart_answer, temporal_gate: enforce, temporal_render: full}
    visibility: evaluation
    context: {window: 24576, reserved_output_tokens: 4096, exact_tokenizer: true, supplemental_sources: [knowledge-base]}
    knobs: {answer: {temperature: 0}}

  eval-12b-answer-only:
    label: 12B answer only
    topology: single
    stages: *single_answer
    models: {answer: gemma-4-12b}
    prompts: {answer: synthesis-answer}
    policies: {output: bare, answer_contract: chart_answer, temporal_gate: "off", temporal_render: full}
    visibility: evaluation
    context: {window: 24576, reserved_output_tokens: 4096, exact_tokenizer: true, supplemental_sources: [knowledge-base]}
    knobs: {answer: {temperature: 0}}

  eval-12b-temporal-enforce:
    label: 12B deterministic temporal check
    topology: single
    stages: *single_answer
    models: {answer: gemma-4-12b}
    prompts: {answer: synthesis-answer}
    policies: {output: bare, answer_contract: chart_answer, temporal_gate: enforce, temporal_render: full}
    visibility: evaluation
    context: {window: 24576, reserved_output_tokens: 4096, exact_tokenizer: true, supplemental_sources: [knowledge-base]}
    knobs: {answer: {temperature: 0}}

  # Washington Health Summary (WAHS+) single-family simple profiles (workflow: wahs, topology: single).
  # Every single-family model has a matched pair of simple profiles:
  #   -kb  : wahs-kb-guided prompt + Step 2 condensed FHIR chart + 4-Layer Clinical KB findings
  #   -raw : wahs-raw-unhinted prompt + Step 2 condensed FHIR chart alone (no KB hints)
  # Exposed via GET /v1/models?workflow=wahs and executed via POST /v1/chat/completions.

  # --- Family 1: Google Gemma 4 (E2B, E4B Q4/Q8, 12B Q4/Q8, 26B-A4B MoE, 31B) ---
  wahs-12b-kb:
    label: "Gemma 4 12B (Q8) — + 4-Layer Clinical KB"
    workflow: wahs
    topology: single
    stages: [context, answer, gate]
    models: {answer: gemma-4-12b}
    prompts: {answer: wahs-kb-guided}
    policies:
      provider: local
      model_family: gemma-4
      parameter_size: "12B"
      quantization: "Q8_0"
      include_kb_findings: true
      overflow_lookup_tools: true
      citation_grounding: enforce
      description: "Default WAHS+ profile: pairs Google Gemma 4 12B (Q8_0) with the Step 2 Condensed FHIR Chart Ledger and 4-Layer Clinical KB Findings."
    knobs:
      answer: {temperature: 0.1, dry: 0.0, maxTokens: 4096}
    visibility: product
    default: true
    selection_priority: 10
    context: {window: 24576, reserved_output_tokens: 2048, exact_tokenizer: true}

  wahs-12b-raw:
    label: "Gemma 4 12B (Q8) — Raw Condensed Chart Only"
    workflow: wahs
    topology: single
    stages: [context, answer, gate]
    models: {answer: gemma-4-12b}
    prompts: {answer: wahs-raw-unhinted}
    policies:
      provider: local
      model_family: gemma-4
      parameter_size: "12B"
      quantization: "Q8_0"
      include_kb_findings: false
      overflow_lookup_tools: false
      citation_grounding: enforce
      description: "Unhinted control for Gemma 4 12B (Q8_0): passes ONLY the Step 2 Condensed FHIR Chart Ledger without 4-Layer Clinical KB hints."
    knobs:
      answer: {temperature: 0.1, dry: 0.0, maxTokens: 4096}
    visibility: product
    selection_priority: 11
    context: {window: 24576, reserved_output_tokens: 2048, exact_tokenizer: true}

  wahs-12b-q4-kb:
    label: "Gemma 4 12B (Q4) — + 4-Layer Clinical KB"
    workflow: wahs
    topology: single
    stages: [context, answer, gate]
    models: {answer: gemma-4-12b-q4}
    prompts: {answer: wahs-kb-guided}
    policies:
      provider: local
      model_family: gemma-4
      parameter_size: "12B"
      quantization: "Q4_K_M"
      include_kb_findings: true
      overflow_lookup_tools: true
      citation_grounding: enforce
      description: "Quantization control: Google Gemma 4 12B at Q4_K_M with 4-Layer Clinical KB Findings."
    knobs:
      answer: {temperature: 0.1, dry: 0.0, maxTokens: 4096}
    visibility: product
    selection_priority: 12
    context: {window: 24576, reserved_output_tokens: 2048, exact_tokenizer: true}

  wahs-12b-q4-raw:
    label: "Gemma 4 12B (Q4) — Raw Condensed Chart Only"
    workflow: wahs
    topology: single
    stages: [context, answer, gate]
    models: {answer: gemma-4-12b-q4}
    prompts: {answer: wahs-raw-unhinted}
    policies:
      provider: local
      model_family: gemma-4
      parameter_size: "12B"
      quantization: "Q4_K_M"
      include_kb_findings: false
      overflow_lookup_tools: false
      citation_grounding: enforce
      description: "Unhinted quantization control: Google Gemma 4 12B at Q4_K_M on the Condensed FHIR Chart Ledger alone."
    knobs:
      answer: {temperature: 0.1, dry: 0.0, maxTokens: 4096}
    visibility: product
    selection_priority: 13
    context: {window: 24576, reserved_output_tokens: 2048, exact_tokenizer: true}

  wahs-e2b-kb:
    label: "Gemma 4 E2B (Q4) — + 4-Layer Clinical KB"
    workflow: wahs
    topology: single
    stages: [context, answer, gate]
    models: {answer: gemma-e2b}
    prompts: {answer: wahs-kb-guided}
    policies:
      provider: local
      model_family: gemma-4
      parameter_size: "E2B"
      quantization: "Q4_K_M"
      include_kb_findings: true
      overflow_lookup_tools: true
      citation_grounding: enforce
      description: "Ultra-compact edge profile (~3 GB): Google Gemma 4 E2B paired with the 4-Layer Clinical KB."
    knobs:
      answer: {temperature: 0.1, dry: 0.0, maxTokens: 4096}
    visibility: product
    selection_priority: 14
    context: {window: 24576, reserved_output_tokens: 2048, exact_tokenizer: true}

  wahs-e2b-raw:
    label: "Gemma 4 E2B (Q4) — Raw Condensed Chart Only"
    workflow: wahs
    topology: single
    stages: [context, answer, gate]
    models: {answer: gemma-e2b}
    prompts: {answer: wahs-raw-unhinted}
    policies:
      provider: local
      model_family: gemma-4
      parameter_size: "E2B"
      quantization: "Q4_K_M"
      include_kb_findings: false
      overflow_lookup_tools: false
      citation_grounding: enforce
      description: "Unhinted ultra-compact edge control: Google Gemma 4 E2B on the Condensed FHIR Chart Ledger alone."
    knobs:
      answer: {temperature: 0.1, dry: 0.0, maxTokens: 4096}
    visibility: product
    selection_priority: 15
    context: {window: 24576, reserved_output_tokens: 2048, exact_tokenizer: true}

  wahs-e4b-kb:
    label: "Gemma 4 E4B (Q4) — + 4-Layer Clinical KB"
    workflow: wahs
    topology: single
    stages: [context, answer, gate]
    models: {answer: gemma-e4b}
    prompts: {answer: wahs-kb-guided}
    policies:
      provider: local
      model_family: gemma-4
      parameter_size: "E4B"
      quantization: "Q4_K_M"
      include_kb_findings: true
      overflow_lookup_tools: true
      citation_grounding: enforce
      description: "Compact edge profile (~5 GB): pairs Google Gemma 4 E4B (Q4_K_M) with the 4-Layer Clinical KB."
    knobs:
      answer: {temperature: 0.1, dry: 0.0, maxTokens: 4096}
    visibility: product
    selection_priority: 16
    context: {window: 24576, reserved_output_tokens: 2048, exact_tokenizer: true}

